# Carnes Merces - iOS SEM assinatura Apple Developer
# Build do .app com --no-codesign, empacotado em .ipa para sideload e assinatura local.
# O IPA gerado AINDA NAO ESTA ASSINADO e nao instala sozinho no iPhone.
workflows:
  carnes-merces-ios-unsigned:
    name: "Carnes Merces - iOS sem certificado (IPA para Sideloadly)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        SOFT_API_BASE_URL: "https://loja.carnesmerces.com.br/api/mobile/v1"
    scripts:
      - name: Gerar projeto iOS e preparar permissões
        script: |
          set -eu
          flutter --version
          python3 tooling/sync_ios_branding.py --api-url "$SOFT_API_BASE_URL"
          flutter create --platforms=ios --org br.com.softsistemas --project-name soft_ecommerce_mobile .
          python3 tooling/prepare_ios.py
          flutter pub get
      - name: Testar GPS e identidade visual
        script: |
          set -eu
          flutter test test/rev5_gps_city_test.dart test/rev6_ios_branding_test.dart test/rev7_compact_navigation_test.dart
      - name: Compilar iOS sem certificado
        script: |
          set -eu
          flutter build ios --release --no-codesign \
            --build-name=1.6.42 --build-number=202 \
            --dart-define=SOFT_API_BASE_URL="$SOFT_API_BASE_URL"
      - name: Empacotar .app como IPA sem assinatura para Sideloadly
        script: |
          set -eu
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa
          temp_dir="$(mktemp -d)"
          cp -R build/ios/iphoneos/Runner.app "$temp_dir/Runner.app"
          mkdir -p "$temp_dir/Payload"
          mv "$temp_dir/Runner.app" "$temp_dir/Payload/Runner.app"
          ipa_file="$CM_BUILD_DIR/build/ios/ipa/Carnes_Merces_1.6.42_202_UNSIGNED.ipa"
          (cd "$temp_dir" && zip -q -r "$ipa_file" Payload)
          unzip -t "$ipa_file" >/dev/null
          test -s "$ipa_file"
          echo "IPA SEM ASSINATURA gerado em: $ipa_file"
          rm -rf "$temp_dir"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app/**
      - /tmp/xcodebuild_logs/*.log
